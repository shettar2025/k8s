apiVersion: apps/v1
kind: Deployment
metadata:
  name: studentapp-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: studentapp
  template:
    metadata:
      labels:
        app: studentapp
    spec:
      serviceAccountName: studentapp-sa 
      containers:
      - name: studentapp-repo
        image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/studentapp-repo:latest
        ports:
        - containerPort: 8080
