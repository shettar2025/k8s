apiVersion: apps/v1
kind: Deployment
metadata:
  name: studentapp-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: studentapp
  template:
    metadata:
      labels:
        app: studentapp
    spec:
      serviceAccountName: studentapp-sa 
      imagePullSecrets:
        - name: ecr-secret
      containers:
      - name: studentapp-repo
        image: 438987840260.dkr.ecr.eu-north-1.amazonaws.com/studentapp-repo:latest
        ports:
        - containerPort: 8080
